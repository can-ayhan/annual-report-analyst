[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annual-report-analyst"
version = "0.1.0"
description = "Multi-agent question answering over public company annual reports, with the page behind every claim"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8",
    "groq>=1.0",
    "langgraph>=1.2",
    "pgvector>=0.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pymupdf>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
analyst = "analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]      # test data is easier to read on one line

[tool.ruff.lint.isort]
known-first-party = ["analyst", "fakes"]
