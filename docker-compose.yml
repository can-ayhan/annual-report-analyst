services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reports-db
    environment:
      POSTGRES_USER: ${PGUSER:-analyst}
      POSTGRES_PASSWORD: ${PGPASSWORD:-analyst}
      POSTGRES_DB: ${PGDATABASE:-reports}
    ports:
      - "${PGPORT:-5436}:5432"
    volumes:
      - reports-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-analyst} -d ${PGDATABASE:-reports}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reports-data:
